spring.application.name=Roady
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:rdb/schema.sql
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

roady.default-users.enabled=${ROADY_DEFAULT_USERS_ENABLED:true}
roady.sample-data.enabled=${ROADY_SAMPLE_DATA_ENABLED:true}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

mqtt.enabled=${MQTT_ENABLED:true}
mqtt.broker-ip=${MQTT_BROKER_IP:localhost}
mqtt.broker-port=${MQTT_BROKER_PORT:1883}

roady.robot-location.redis-key-pattern=${ROADY_ROBOT_LOCATION_REDIS_KEY_PATTERN:roady:robots:{robotId}:location}
roady.robot-location.ttl=${ROADY_ROBOT_LOCATION_TTL:5m}

roady.ai.image-analysis.endpoint-url=${ROADY_AI_IMAGE_ANALYSIS_ENDPOINT_URL:}
roady.ai.image-analysis.worker-enabled=${ROADY_AI_IMAGE_ANALYSIS_WORKER_ENABLED:false}
roady.ai.image-analysis.queue-key=${ROADY_AI_IMAGE_ANALYSIS_QUEUE_KEY:roady:damage:image-analysis:queue}
roady.ai.image-analysis.dead-letter-queue-key=${ROADY_AI_IMAGE_ANALYSIS_DEAD_LETTER_QUEUE_KEY:roady:damage:image-analysis:dead-letter}
roady.ai.image-analysis.batch-size=${ROADY_AI_IMAGE_ANALYSIS_BATCH_SIZE:3}
roady.ai.image-analysis.poll-delay-ms=${ROADY_AI_IMAGE_ANALYSIS_POLL_DELAY_MS:1000}
roady.ai.image-analysis.request-timeout=${ROADY_AI_IMAGE_ANALYSIS_REQUEST_TIMEOUT:3m}

roady.geocoding.kakao.enabled=${ROADY_KAKAO_GEOCODING_ENABLED:false}
roady.geocoding.kakao.rest-api-key=${ROADY_KAKAO_REST_API_KEY:}
roady.geocoding.kakao.coord2-address-url=${ROADY_KAKAO_COORD2_ADDRESS_URL:https://dapi.kakao.com/v2/local/geo/coord2address.json}
roady.geocoding.kakao.coord2-region-code-url=${ROADY_KAKAO_COORD2_REGION_CODE_URL:https://dapi.kakao.com/v2/local/geo/coord2regioncode.json}
roady.geocoding.kakao.request-timeout=${ROADY_KAKAO_GEOCODING_REQUEST_TIMEOUT:3s}

roady.cors.allowed-origins=${ROADY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}

roady.jwt.secret=roady-local-development-secret-key-change-before-production
roady.jwt.access-token-validity-minutes=30
roady.jwt.refresh-token-validity-days=14
