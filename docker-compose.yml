services:
  mysql:
    image: mysql:8.4
    container_name: roady-mysql
    env_file:
      - ./Roady_BE/.env
    environment:
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: roady-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    container_name: roady-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./Roady_BE/docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 5"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Roady_BE
    container_name: roady-backend
    env_file:
      - ./Roady_BE/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/roady?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MQTT_BROKER_IP: mqtt
      MQTT_BROKER_PORT: 1883
      ROADY_CORS_ALLOWED_ORIGINS: ${ROADY_CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./Roady_FE
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: roady-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  mqtt-data:
