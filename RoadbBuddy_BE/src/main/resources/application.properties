spring.application.name=RoadBuddy
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:rdb/schema.sql

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

roadbuddy.jwt.secret=roadbuddy-local-development-secret-key-change-before-production
roadbuddy.jwt.access-token-validity-minutes=30
roadbuddy.jwt.refresh-token-validity-days=14
