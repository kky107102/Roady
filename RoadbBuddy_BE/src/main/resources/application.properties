spring.application.name=RoadBuddy
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:rdb/schema.sql
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

roadbuddy.ai.image-analysis.endpoint-url=${ROADBUDDY_AI_IMAGE_ANALYSIS_ENDPOINT_URL:}
roadbuddy.ai.image-analysis.worker-enabled=${ROADBUDDY_AI_IMAGE_ANALYSIS_WORKER_ENABLED:false}
roadbuddy.ai.image-analysis.queue-key=${ROADBUDDY_AI_IMAGE_ANALYSIS_QUEUE_KEY:roadbuddy:damage:image-analysis:queue}
roadbuddy.ai.image-analysis.dead-letter-queue-key=${ROADBUDDY_AI_IMAGE_ANALYSIS_DEAD_LETTER_QUEUE_KEY:roadbuddy:damage:image-analysis:dead-letter}
roadbuddy.ai.image-analysis.batch-size=${ROADBUDDY_AI_IMAGE_ANALYSIS_BATCH_SIZE:3}
roadbuddy.ai.image-analysis.poll-delay-ms=${ROADBUDDY_AI_IMAGE_ANALYSIS_POLL_DELAY_MS:1000}
roadbuddy.ai.image-analysis.request-timeout=${ROADBUDDY_AI_IMAGE_ANALYSIS_REQUEST_TIMEOUT:3m}

roadbuddy.cors.allowed-origins=${ROADBUDDY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}

roadbuddy.jwt.secret=roadbuddy-local-development-secret-key-change-before-production
roadbuddy.jwt.access-token-validity-minutes=30
roadbuddy.jwt.refresh-token-validity-days=14
